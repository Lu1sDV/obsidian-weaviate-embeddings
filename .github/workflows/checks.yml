name: Checks
on:
  push:
    branches: [master, 'feat/jev-*']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run eval:rerank
      - run: npm run package
      - name: Archive reproducible review workspace
        run: |
          git archive --format=tar HEAD | gzip > review-source.tar.gz
          tar --exclude='node_modules/onnxruntime-node/bin' --exclude='node_modules/onnxruntime-web/dist/*.wasm' -czf review-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: review-workspace
          path: |
            review-source.tar.gz
            review-dependencies.tar.gz
          retention-days: 1
